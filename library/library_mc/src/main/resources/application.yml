server:
  port: 8080

spring:
  application:
    name: library-server
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/library_mc?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  type-aliases-package: com.example.library.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: my-jwt-secret-key-2024-library-system
  expire: 86400000
  header: Authorization
